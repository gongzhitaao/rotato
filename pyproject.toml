[project]
name = "rotato"
version = "0.4.0"
description = "Serverless secret/key rotation into Bitwarden Secrets Manager"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zhitao Gong", email = "zhitaao.gong@gmail.com" }]
keywords = [
    "bitwarden",
    "secrets",
    "secret-rotation",
    "credentials",
    "cli",
    "cloud-run",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "argcomplete>=3.7.0",
    "bitwarden-sdk>=2.1.0",
    "httpx2>=2.10.0",
    "pyjwt[crypto]>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/gongzhitaao/rotato"
Repository = "https://github.com/gongzhitaao/rotato"
Issues = "https://github.com/gongzhitaao/rotato/issues"

[project.scripts]
rotato = "rotato.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rotato*"]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pylint>=4.0.6",
    "pylint-google-style>=0.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["*_test.py"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 80          # match Google's pylintrc max-line-length
target-version = "py312"
src = ["src"]             # first-party root for import sorting

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

# pylint uses .pylintrc (Google's config, checked in at the repo root).
