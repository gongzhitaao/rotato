[project]
name = "rotato"
version = "0.1.0"
description = "Serverless secret/key rotation into Bitwarden Secrets Manager"
requires-python = ">=3.10"
dependencies = [
    "bitwarden-sdk>=2.1.0",
    "httpx>=0.28.1",
]

[project.scripts]
rotato = "rotato.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rotato*"]

[dependency-groups]
dev = [
    "pylint>=4.0.6",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 80          # match Google's pylintrc max-line-length
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

# pylint uses .pylintrc (Google's config, checked in at the repo root).
