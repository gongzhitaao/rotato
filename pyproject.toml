[project]
name = "rotato"
version = "0.1.0"
description = "Serverless secret/key rotation into Bitwarden Secrets Manager"
requires-python = ">=3.10"
dependencies = [
    "bitwarden-sdk>=2.1.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rotato*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
