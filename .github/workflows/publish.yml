name: Publish

# Build and publish to PyPI on a GitHub Release, via PyPI Trusted Publishing
# (OIDC) — no API token is stored in the repo. One-time setup on pypi.org:
# add a trusted publisher for project `rotato` -> owner gongzhitaao, repo
# rotato, workflow `publish.yml`, environment `pypi`.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Verify tag matches package version
        if: github.event_name == 'release'
        run: |
          pkg=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          tag=${GITHUB_REF_NAME#v}
          [ "$pkg" = "$tag" ] || { echo "pyproject version $pkg != release tag $tag"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
