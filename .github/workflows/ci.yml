name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff format
        run: uv run ruff format --check src
      - name: ruff lint
        run: uv run ruff check src
      - name: pylint
        run: uv run pylint src/rotato
      - name: pytest
        run: uv run pytest
